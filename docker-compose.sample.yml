volumes:
  simpledms_data:
  versitygw_data:

services:
  simpledms:
    image: "ghcr.io/simpledms/simpledms:stable"
    env_file: ".env"
    depends_on:
      versitygw:
        condition: service_started
      tika:
        condition: service_started
      gotenberg:
        condition: service_started
      # xberg:
      #   condition: service_started
    restart: unless-stopped
    # if you run SimpleDMS locally, you probably want to use other ports
    ports:
      - 80:80 # for autocert
      - 443:443
    volumes:
      - simpledms_data:/srv
    environment:
      SIMPLEDMS_GOTENBERG_URL: http://gotenberg:3000
      # SIMPLEDMS_OCR_XBERG_URL: http://xberg:8000

  tika:
    image: apache/tika:latest-full
    restart: unless-stopped

  # optional alternative to Tika for OCR; if both are configured, Xberg is used and Tika is
  # the fallback for formats Xberg does not support and for empty Xberg results
  # xberg:
  #   # core is sufficient because SimpleDMS only uses Tesseract; pinned because the OCR
  #   # options SimpleDMS sends are validated strictly and were verified with this version
  #   image: ghcr.io/xberg-io/xberg:1.3.6-core
  #   environment:
  #     # blocks Hugging Face model downloads; SimpleDMS needs no models
  #     HF_HUB_OFFLINE: "1"
  #   restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - "gotenberg"
      - "--chromium-auto-start=true"
      - "--chromium-deny-private-ips=true"
      - "--libreoffice-deny-private-ips=true"
      - "--api-disable-download-from=true"
    restart: unless-stopped

  # versity gateway is only necessary if you don't have S3 storage yet and want to store
  # the files in a Docker volume (this example) or on your file system
  versitygw:
    image: versity/versitygw:latest
    restart: unless-stopped
    volumes:
      - versitygw_data:/data
    environment:
      ROOT_ACCESS_KEY_ID: unsafe-placeholder-access-key-id
      ROOT_SECRET_ACCESS_KEY: unsafe-placeholder-secret-access-key
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
